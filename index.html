<!DOCTYPE html>
<html>
<head>
  <link rel="manifest" href="manifest.json">
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Limit MLBB</title>
<style>
body{font-family:sans-serif;text-align:center;padding:30px;background:#0f0f0f;color:white}
h1{font-size:80px;margin:10px}
button{font-size:20px;padding:18px;border-radius:16px;border:none;width:100%;margin-top:12px;font-weight:bold}
.btn-bot{background:#ff4655;color:white}
.btn-reset{background:#222;color:#aaa;border:1px solid #333}
#info{margin-top:20px;color:#666;font-size:13px}
</style>
</head>
<body>
<p>Limit</p>
<h1 id="sisa">7</h1>
<p>/ 7</p>
<button class="btn-bot" onclick="kurang()">DONE</button>
<button class="btn-reset" onclick="resetManual()">Reset Limit</button>
<p id="info">Reset otomatis jam 21:00<br>Notifikasi jam 19:00 kalau masih sisa</p>

<script>
let sisa = localStorage.getItem('sisa') ? parseInt(localStorage.getItem('sisa')) : 7;
let hariIni = new Date().toDateString();
document.getElementById('sisa').innerText = sisa;

if(Notification.permission !== "granted"){ Notification.requestPermission(); }

function kurang(){
  if(sisa>0){ sisa--; simpan();
  if(sisa==0) alert("Habis! Tunggu jam 9 reset atau reset manual pakai PIN");
 }
}

function simpan(){
  localStorage.setItem('sisa',sisa);
  localStorage.setItem('tgl',hariIni);
  document.getElementById('sisa').innerText=sisa;
}

function resetManual(){
  let pin = prompt("Masukkan PIN reset:");
  if(pin == "272007"){
    sisa=7; simpan();
    alert("Berhasil reset limit");
  } else if(pin != null) {
    alert("PIN salah");
  }
}

setInterval(()=>{
  let now = new Date();
  if(now.getHours()==19 && now.getMinutes()==0 && sisa>0){
    new Notification("Limit ML mau hangus!", {body:`Sisa ${sisa}x lagi bos, habisin sebelum jam 9!`});
  }
  if(now.getHours()==21 && now.getMinutes()==0){
    sisa=7; simpan();
    new Notification("Reset!", {body:"Limit balik jadi 7 lagi!"});
  }
}, 60000);
</script>
</body>
</html>
